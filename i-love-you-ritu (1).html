  }
}

    max-width: 1536px;
  }

:root {
  --surface: #fff0f5;
  --surface-2: #ffe4ec;
  --surface-3: #ffd6e7;
  --ink: #4b1227;
  --muted: #8a4a63;
  --primary: #ff2e63;
  --hot: #ff3f8e;
  --card: rgba(255, 255, 255, 0.78);
  --line: rgba(255, 46, 99, 0.18);
  --shadow: 0 22px 55px rgba(255, 46, 99, 0.16);
  --creator-bar-height: 46px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface: #2b0c1a;
    --surface-2: #401324;
    --surface-3: #561a32;
    --ink: #fff0f5;
    --muted: #f2b8cc;
    --card: rgba(70, 20, 40, 0.78);
    --line: rgba(255,255,255,.18);
    --shadow: 0 22px 55px rgba(0,0,0,.3);
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Poppins', system-ui, sans-serif;
  color: var(--ink);
  background: var(--surface);
  overflow-x: clip;
}

button, a {
  font: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
}

.app-shell {
  min-height: 100vh;
  padding-top: var(--safe-area-inset-top);
  background: linear-gradient(180deg, var(--surface), var(--surface-2) 38%, var(--surface-3));
  overflow-x: clip;
  position: relative;
}

.creator-bar {
  position: sticky;
  top: var(--safe-area-inset-top);
  z-index: 50;
  min-height: var(--creator-bar-height);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 11px 14px;
  background: linear-gradient(90deg, #ff6b9d 0%, #ff2e63 48%, #e6004c 100%);
  color: #fff;
  font-size: clamp(11px, 3.4vw, 14px);
  font-weight: 700;
  letter-spacing: .14em;
  text-align: center;
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(255, 46, 99, .32), inset 0 1px 0 rgba(255, 255, 255, .35);
  text-shadow: 0 1px 6px rgba(120, 0, 35, .25);
}

.creator-bar svg {
  flex: 0 0 auto;
  filter: drop-shadow(0 1px 3px rgba(120, 0, 35, .35));
}

.creator-bar span {
  overflow: hidden;
  text-overflow: ellipsis;
}

.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.falling {
  position: absolute;
  top: -40px;
  max-width: 36px;
  animation: fall linear infinite;
  filter: drop-shadow(0 4px 8px rgba(255,46,99,.25));
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(28deg);
  }
}

.hidden-main {
  height: 0;
  overflow: hidden;
  visibility: hidden;
}

.revealed {
  position: relative;
  z-index: 1;
  animation: fadeIn .7s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

.envelope-screen {
  min-height: calc(100vh - var(--safe-area-inset-top) - var(--creator-bar-height));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 28px 20px;
  position: relative;
  z-index: 5;
}

.envelope-kicker {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--primary);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .18em;
}

.envelope-screen h1 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(58px, 12vw, 118px);
  line-height: 1.02;
  letter-spacing: .01em;
  margin: 20px 0 10px;
}

.envelope-screen h1 span {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 1.18em;
  letter-spacing: .01em;
  color: var(--primary);
  text-shadow: 0 8px 30px rgba(255,46,99,.35);
}

.envelope-line {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 36px;
  letter-spacing: .02em;
  line-height: 1.2;
  margin: 0 0 28px;
  color: var(--muted);
}

.envelope {
  width: min(340px, 88vw);
  aspect-ratio: 1.45;
  border: 0;
  border-radius: 18px;
  background: linear-gradient(145deg, #ff6b9d, #ff2e63);
  position: relative;
  overflow: hidden;
  box-shadow: 0 28px 60px rgba(255,46,99,.35);
  transition: transform .35s ease;
}

.envelope:hover {
  transform: translateY(-4px) rotate(-1deg);
}

.envelope-flap {
  position: absolute;
  inset: 0 0 auto;
  height: 52%;
  background: #ff89ad;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transition: transform .8s ease;
  transform-origin: top;
  z-index: 2;
}

.envelope-heart {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 62px;
  z-index: 1;
  animation: heartbeat 1.6s infinite;
}

.envelope-name {
  position: absolute;
  bottom: 18px;
  width: 100%;
  left: 0;
  color: white;
  font-weight: 800;
  letter-spacing: .5em;
  text-indent: .5em;
}

.envelope-seal {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 46%;
  transform: translate(-50%, -50%);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #fff;
  display: grid;
  place-items: center;
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 26px;
  line-height: 1;
  color: var(--primary);
  box-shadow: 0 0 0 5px rgba(255,255,255,.3);
}

.is-opening .envelope-flap {
  transform: rotateX(180deg);
  opacity: .2;
}

.is-opening .envelope {
  transform: scale(1.04);
}

.tap-open {
  margin-top: 28px;
  border: 0;
  background: var(--ink);
  color: white;
  padding: 15px 26px;
  border-radius: 999px;
  display: flex;
  gap: 10px;
  align-items: center;
  font-weight: 700;
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
}

.tiny-note {
  color: var(--muted);
  font-size: 13px;
}

.topbar {
  position: sticky;
  top: calc(var(--safe-area-inset-top) + var(--creator-bar-height));
  z-index: 10;
  max-width: 1160px;
  margin: 0 auto;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 34px;
  line-height: 1;
  letter-spacing: .02em;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--primary);
}

.topbar nav {
  display: flex;
  gap: 20px;
  font-size: 13px;
  font-weight: 600;
}

.topbar nav a {
  text-decoration: none;
}

.hero {
  max-width: 1160px;
  margin: 8px auto 0;
  padding: 24px 20px 70px;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 36px;
  align-items: center;
}

.eyebrow, .mini {
  color: var(--primary);
  font-size: 11px;
  letter-spacing: .2em;
  font-weight: 800;
}

.love-title {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(62px, 8.5vw, 114px);
  line-height: .98;
  letter-spacing: .015em;
  margin: 22px 0 4px;
  display: flex;
  flex-direction: column;
  text-shadow: 0 0 34px rgba(255,46,99,.22);
  animation: heartbeat 2s infinite;
}

.love-title span:last-child {
  color: var(--primary);
}

@keyframes heartbeat {
  0%,100% {
    transform: scale(1);
  }

  18% {
    transform: scale(1.06);
  }

  30% {
    transform: scale(1);
  }

  45% {
    transform: scale(1.04);
  }

}

.love-button {

  color: var(--primary);
  border: 1px solid var(--line);
}

.hero-meta {

  gap: 10px;
  font-size: 13px;
}

.hero-visual {
  position: relative;
}

.hero-visual img {

  height: min(580px, 72vw);
  min-height: 380px;
  -o-object-fit: cover;
     object-fit: cover;
  -o-object-position: center 28%;
     object-position: center 28%;
  border-radius: 36px;
  border: 7px solid rgba(255,255,255,.85);
  box-shadow: var(--shadow);
  display: block;
}

.hero-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 36px;

  pointer-events: none;
}

.photo-badge {
  position: absolute;
  z-index: 2;
  top: 22px;
  left: 18px;
  background: rgba(255,255,255,.9);

  border-radius: 18px;
  padding: 11px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  box-shadow: 0 10px 25px rgba(0,0,0,.12);
}

.photo-badge div {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.photo-badge small {
  color: var(--muted);
}

.photo-caption {
  position: absolute;
  z-index: 2;
  bottom: 20px;
  left: 18px;
  right: 18px;
  color: white;
  font-family: 'Dancing Script', cursive;
  font-weight: 700;

  text-shadow: 0 2px 12px #7d1230;
}

.section {
  max-width: 1160px;
  margin: 0 auto;
  padding: 55px 20px;
}

.section-head {
  text-align: center;
  max-width: 650px;
  margin: 0 auto 34px;
}

.section-head h2, .meter-copy h2, .promise-section h2 {

  font-style: italic;

.section-head p {

}

.reason-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.reason-card {
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 25px;
  box-shadow: var(--shadow);
  transition: transform .25s;
}

.reason-card:hover {

}

.reason-top {
  display: flex;
  justify-content: space-between;
  align-items: start;
}

.reason-icon {

  height: 54px;
  border-radius: 17px;

}

.reason-emoji {
  font-size: 26px;
}

.reason-card h3 {

.reason-card p {

}

  grid-template-columns: 1fr 1fr;
  gap: 38px;
  align-items: center;

}

.meter-section .mini {
  color: #ffe4ec;
}

.meter-copy h2 {
  color: white;
}

.meter-copy p {
  color: #ffe9f0;
  line-height: 1.6;
}

.meter-copy .primary {
  background: white;
  color: var(--primary);
}

.infinity-note {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 36px !important;
  line-height: 1.2;
  letter-spacing: .02em;
  color: white !important;
  margin: 18px 0 0;
}

.meter-card {
  background: rgba(255,255,255,.94);
  color: var(--ink);
  border-radius: 26px;

  text-align: center;
}

.meter-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 800;
}

.meter-top strong {
  color: var(--primary);
  font-size: 26px;
}

.meter-track {
  height: 15px;
  background: #ffe1ec;
  border-radius: 99px;
  overflow: hidden;
  margin: 22px 0;
}

.meter-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff2e63, #ff8fb2);
  transition: width .12s;
  border-radius: inherit;
}

.meter-icon {
  color: var(--primary);
  animation: heartbeat 1.4s infinite;
  display: grid;
  place-items: center;
  height: 88px;
}

.meter-card p {
  color: var(--muted);
  margin: 8px 0 0;
}

.proposal-section {

  padding: 0 20px;

  border: 1px solid var(--line);
  border-radius: 34px;
  padding: 42px 30px;
  text-align: center;
  box-shadow: var(--shadow);
  overflow: hidden;
  position: relative;

.ring {

  animation: heartbeat 1.8s infinite;
}

.proposal-card h2 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(36px, 5.4vw, 56px);
  margin: 14px 0;
  line-height: 1.15;
  letter-spacing: .01em;
}

.proposal-card p {
  color: var(--muted);
}

.choice-zone {
  min-height: 120px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  margin: 22px 0 14px;
}

.yes-btn {
  border: 0;
  background: var(--primary);
  color: white;
  border-radius: 999px;
  padding: 16px 36px;
  font-size: 20px;
  font-weight: 800;
  box-shadow: 0 16px 30px rgba(255,46,99,.35);
  z-index: 2;
}

.no-btn {
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  border-radius: 999px;
  padding: 14px 22px;
  font-weight: 700;
  transition: transform .25s ease;
  max-width: 260px;
}

.proposal-card small {
  color: var(--muted);
}

.letter-section {
  max-width: 850px;
  margin: 0 auto;
  padding: 35px 20px;
}

.letter-paper {
  background: #fffdf5;
  color: #5d2739;
  border-radius: 8px 8px 28px 28px;
  padding: 38px;
  box-shadow: 0 22px 55px rgba(120,20,55,.18);
  transform: rotate(-.5deg);
  position: relative;
}

.letter-paper::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 10px;
  background: repeating-linear-gradient(90deg, #ff2e63 0 22px, transparent 22px 38px);
}

.letter-head {
  display: flex;
  justify-content: space-between;
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 42px;
  line-height: 1.2;
  letter-spacing: .02em;
  color: var(--primary);
  margin-top: 10px;
}

.letter-paper p {
  font-size: 18px;
  line-height: 1.8;
}

.letter-sign {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
}

.letter-sign > span {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 36px;
  line-height: 1.2;
  letter-spacing: .02em;
  color: var(--primary);
}

.letter-sign button {
  border: 0;
  background: #ffe2ec;
  color: var(--primary);
  border-radius: 999px;
  padding: 11px 16px;
  font-weight: 700;
}

  padding: 35px 20px 60px;

  grid-template-columns: repeat(3, 1fr);
  gap: 18px;

  display: block;

.promise-grid h3 {
  font-size: 21px;
}

.promise-grid p {
  color: var(--muted);
  line-height: 1.6;
}

footer {
  text-align: center;
  padding: 56px 20px 46px;
  border-top: 1px solid var(--line);
}

.footer-heart {
  font-size: 50px;
  animation: heartbeat 1.5s infinite;
}

footer h2 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: clamp(36px, 5.4vw, 58px);
  line-height: 1.15;
  letter-spacing: .01em;
  margin: 12px 0 0;
}

.created {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  font-size: 46px;
  line-height: 1.2;
  letter-spacing: .02em;
  color: var(--primary);
  margin: 8px 0;
}

  color: var(--muted);
  margin: 0;
}

  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  padding: 11px 18px;
  border-radius: 999px;
  margin-top: 24px;
  font-weight: 700;
}

  position: fixed;
  z-index: 100;
  pointer-events: none;
  animation: burst 1.35s ease-out forwards;
  transform: translate(-50%, -50%);
}

@keyframes burst {
  0% {
    opacity: 1;
    transform: translate(-50%,-50%) scale(.3);
  }

  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--drift)), -190px) scale(1.25) rotate(20deg);
  }
}

.celebration, .modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(54,8,28,.72);
  backdrop-filter: blur(8px);
  display: grid;
  place-items: center;
  padding: 20px;
}

.yes-popup, .modal-letter {
  background: #fff7fa;
  color: var(--ink);
  border-radius: 30px;
  padding: 38px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,.3);
}

.big-hearts {
  font-size: 48px;
  animation: heartbeat 1.2s infinite;
}

.yes-popup h2 {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 700;
  font-size: 38px;
  line-height: 1.25;
  letter-spacing: .01em;
}

.close {
  position: absolute;
  right: 16px;
  top: 16px;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: #ffe2ec;
  color: var(--primary);
  display: grid;
  place-items: center;
}

.confetti {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.confetti i {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 18px;
  border-radius: 3px;
  animation: confettiFall 2.4s ease-in forwards;
}

@keyframes confettiFall {
  to {
    transform: translateY(105vh) rotate(620deg);
    opacity: .2;
  }
}

.modal-letter {
  text-align: left;
  background: #fffdf5;
}

.modal-letter h2 {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  color: var(--primary);
  font-size: 48px;
  line-height: 1.2;
  letter-spacing: .02em;
  margin: 10px 0;
}

.modal-letter p {
  line-height: 1.8;
}

.modal-sign {
  font-family: 'Dancing Script', cursive;
  font-weight: 700;
  color: var(--primary);
  font-size: 36px;
  line-height: 1.2;
  letter-spacing: .02em;
}

@media (max-width: 700px) {
  .topbar nav {
    display: none;
  }

  .hero {
    grid-template-columns: 1fr;
    padding-top: 10px;
    gap: 24px;
  }

  .hero-visual img {
    height: 460px;
    min-height: 360px;
  }

  .reason-grid, .promise-grid {
    grid-template-columns: 1fr;
  }

  .meter-section {
    grid-template-columns: 1fr;
    padding: 30px 22px;
    margin: 20px 14px;
  }

  .letter-paper {
    padding: 32px 22px;
  }

  .letter-sign {
    justify-content: center;
    text-align: center;
  }

  .proposal-card {
    padding: 34px 18px;
  }

  .choice-zone {
    gap: 10px;
  }

  .no-btn {
    max-width: 180px;
    font-size: 13px;
    padding: 12px 13px;
  }

  .yes-btn {
    padding: 15px 28px;
  }

  .creator-bar {
    gap: 7px;
    letter-spacing: .08em;
    padding-left: 10px;
    padding-right: 10px;
  }

  .photo-caption {
    font-size: 28px;
  }

  .envelope-screen h1 {
    font-size: 68px;
  }
}

@media (max-width: 390px) {
  .hero {
    padding-left: 14px;
    padding-right: 14px;
  }

  .creator-bar {
    font-size: 11px;
    letter-spacing: .06em;
  }

  .love-title {
    font-size: 58px;
  }

  .ritu-name {
    font-size: 88px;
  }

  .hero-actions .primary, .hero-actions .love-button {
    width: 100%;
    justify-content: center;
  }

  .no-btn {
    max-width: 150px;
  }
}
